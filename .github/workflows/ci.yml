name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uvx ruff@0.17.0 check .
      - name: Format
        run: uvx ruff@0.17.0 format --check .
      - name: Test
        # Tests mock every external API; tests/conftest.py sets dummy keys
        run: uv run pytest --cov=finestcloud --cov-report=term-missing

  frontend:
    name: Frontend (eslint, tsc, jest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format
        # Same Prettier version and file types as .pre-commit-config.yaml
        working-directory: .
        run: >-
          git ls-files -z '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.css'
          | xargs -0 npx --yes prettier@3.1.0 --check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --ci
      - name: Build
        run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: placeholder

  database:
    name: Database (migrations replay, SQL tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          # Throwaway container that only lives for this job
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: frontend/supabase
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration in order on a fresh database, then test
        run: |
          for file in tests/supabase_stub.sql migrations/*.sql tests/*_test.sql; do
            echo "::group::$file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
            echo "::endgroup::"
          done
