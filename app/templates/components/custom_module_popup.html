<div class="custom-module-popup">
    <div class="popup-content">
        <h3>Custom Module Specifications</h3>
        <div class="input-group">
            <label for="custom-height">Height (cm):</label>
            <input type="number" id="custom-height" placeholder="Enter height in cm">
        </div>
        <div class="input-group">
            <label for="custom-width">Width (cm):</label>
            <input type="number" id="custom-width" placeholder="Enter width in cm">
        </div>
        <div class="input-group">
            <label for="custom-power">Power (W):</label>
            <input type="number" id="custom-power" placeholder="Enter power in watts">
        </div>
        <div class="input-group">
            <label for="custom-efficiency">Efficiency (%):</label>
            <input type="number" id="custom-efficiency" placeholder="Enter efficiency in %">
        </div>
        <div class="button-group">
            <button class="save-custom-module">Save</button>
            <button class="close-popup">Cancel</button>
        </div>
    </div>
</div>

<div class="angle-input-popup">
    <div class="angle-input-content">
        <h3>Enter Roof Angles</h3>
        <p>Please enter the pitch angle (0-90°) for each numbered roof section on your map</p>
        
        <div class="angle-input-grid" id="angleInputs">
            <!-- Example of how dynamic inputs will look (these will be generated by JS) -->
            <div class="angle-input-item">
                <label><span class="angle-badge">1</span>Roof Section</label>
                <div class="angle-unit">
                    <input type="number" min="0" max="90" step="0.1" 
                           placeholder="0-90" required
                           class="angle-input"
                           data-index="0">
                </div>
            </div>
            <!-- More items will be added dynamically -->
        </div>
        
        <div class="angle-buttons">
            <button class="btn-secondary" id="cancelAngles">Cancel</button>
            <button class="btn-primary" id="confirmAngles">Confirm</button>
        </div>
    </div>
</div>
