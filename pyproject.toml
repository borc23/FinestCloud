[project]
name = "finestcloud"
version = "2.0.4"
description = "Solar panel detection and configuration API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # FastAPI core
    "fastapi==0.104.1",
    "uvicorn[standard]==0.25.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    # HTTP clients
    "httpx==0.25.2",
    # Machine learning & computer vision
    "torch==2.8.0",
    # Not imported directly (ultralytics needs it), but listed so the CPU-only
    # wheel source below applies to it instead of the multi-GB CUDA build
    "torchvision==0.23.0",
    "ultralytics==8.3.208",
    "numpy<2.0",
    "opencv-python==4.11.0.86",
    "huggingface-hub",
    # Geometry
    "shapely",
]

[project.scripts]
finestcloud = "finestcloud.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "notebook>=7.5.5",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Header",
]
