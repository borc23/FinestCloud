repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        entry: npx stylelint
        language: system
        types: [css]
        args: ["--fix"]

  # ESLint hook disabled - Next.js ESLint needs to be configured first
  # Run: cd frontend && npm run lint to set up ESLint
  # - repo: local
  #   hooks:
  #     - id: eslint
  #       name: eslint (next lint)
  #       entry: bash -c 'cd frontend && npx next lint --fix'
  #       language: system
  #       files: ^frontend/.*\.[jt]sx?$
  #       pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        entry: npx prettier --write
        language: node
        types: [ts, tsx, javascript, json, css]