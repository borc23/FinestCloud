repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uvx ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff Format
        entry: uvx ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: stylelint
        name: stylelint
        entry: npx stylelint
        language: system
        types: [css]
        args: ["--fix"]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (next lint)
        entry: bash -c 'cd frontend && npx next lint --fix'
        language: system
        files: ^frontend/.*\.[jt]sx?$
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, jsx, json, css]
